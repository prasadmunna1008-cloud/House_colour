<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Interior Wall & Room Paint Visualizer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            text-align: center;
        }

        p.instruction {
            color: #555;
            margin-bottom: 20px;
            font-size: 1rem;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 950px;
            width: 100%;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Palette Control Layout */
        .palette-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            max-height: 180px;
            overflow-y: auto;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fafafa;
        }

        .color-card {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .color-card:hover {
            border-color: #2c3e50;
            background: #f0f3f4;
        }

        .color-card.active {
            border-color: #27ae60;
            background: #e8f8f5;
            box-shadow: 0 0 5px rgba(39, 174, 96, 0.4);
        }

        .color-swatch {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .color-details {
            display: flex;
            flex-direction: column;
            font-size: 0.8rem;
        }

        .color-name {
            font-weight: bold;
            color: #333;
        }

        .color-code {
            color: #777;
            font-size: 0.75rem;
        }

        /* 3D Room Container */
        .room-container {
            position: relative;
            width: 100%;
            height: 480px;
            background: #cbd5e1;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #b0bec5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .room {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Room Components */
        .wall {
            position: absolute;
            cursor: pointer;
            transition: background-color 0.3s ease, filter 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.4);
            font-size: 1.1rem;
            border: 1px solid rgba(0,0,0,0.15);
        }

        .wall:hover {
            filter: brightness(0.94);
        }

        /* Upper Wall / Ceiling */
        #upperWall {
            top: 0;
            left: 0;
            width: 100%;
            height: 20%;
            background-color: #e2e8f0;
            border-bottom: 2px solid #cbd5e1;
        }

        /* Back Wall */
        #backWall {
            top: 20%;
            left: 20%;
            width: 60%;
            height: 65%;
            background-color: #d1d8e0;
        }

        /* Left Wall */
        #leftWall {
            top: 20%;
            left: 0;
            width: 20%;
            height: 65%;
            background-color: #a5b1c2;
            transform: skewY(20deg);
            transform-origin: top right;
        }

        /* Right Wall */
        #rightWall {
            top: 20%;
            right: 0;
            width: 20%;
            height: 65%;
            background-color: #778ca3;
            transform: skewY(-20deg);
            transform-origin: top left;
        }

        /* Lower Wall / Floor Area */
        #lowerWall {
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15%;
            background-color: #94a3b8;
            border-top: 2px solid #64748b;
        }

        .selected-status {
            font-size: 0.95rem;
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Interior Wall & Room Paint Visualizer</h1>
    <p class="instruction">Step 1: Choose a color from the professional palette below. Step 2: Click on any section (Upper, Left, Back, Right, or Lower wall) to paint it.</p>

    <div class="container">
        <!-- Color Palette Dialog Box Section -->
        <div class="palette-section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label><strong>Interior Color Catalog:</strong></label>
                <span id="currentColorName" class="selected-status">No color selected</span>
            </div>
            
            <div class="palette-grid" id="paletteGrid">
                <!-- Colors will be dynamically loaded via script -->
            </div>
        </div>

        <!-- 3D Interior Interactive Room View -->
        <div class="room-container">
            <div class="room">
                <div id="upperWall" class="wall" onclick="paintSurface('upperWall')">Upper Wall / Ceiling</div>
                <div id="leftWall" class="wall" onclick="paintSurface('leftWall')">Left Wall</div>
                <div id="backWall" class="wall" onclick="paintSurface('backWall')">Back Wall</div>
                <div id="rightWall" class="wall" onclick="paintSurface('rightWall')">Right Wall</div>
                <div id="lowerWall" class="wall" onclick="paintSurface('lowerWall')">Lower Wall / Skirting</div>
            </div>
        </div>
    </div>

    <script>
        // Comprehensive interior color collection with codes
        const interiorColors = [
            { name: "Smart Natural", code: "#f5cd79", hex: "#f5cd79" },
            { name: "Rose Pink", code: "#cf6a87", hex: "#cf6a87" },
            { name: "Royal Blue", code: "#546de5", hex: "#546de5" },
            { name: "Sky Mist", code: "#778beb", hex: "#778beb" },
            { name: "Terracotta", code: "#e15f41", hex: "#e15f41" },
            { name: "Aqua Green", code: "#3dc1d3", hex: "#3dc1d3" },
            { name: "Soft Peach", code: "#f8c291", hex: "#f8c291" },
            { name: "Crystal White", code: "#W-101", hex: "#f8f9fa" },
            { name: "Berber Beige", code: "#2891", hex: "#d7ccc8" },
            { name: "Almond Sand", code: "#2737", hex: "#d4b79c" },
            { name: "Powder Blue", code: "#2366", hex: "#b3e5fc" },
            { name: "Pista Green", code: "#02557", hex: "#c8e6c9" }
        ];

        let activeColor = null;
        let activeColorName = "";

        // Build the palette selection grid
        function initPalette() {
            const grid = document.getElementById('paletteGrid');
            interiorColors.forEach((color, index) => {
                const card = document.createElement('div');
                card.className = 'color-card';
                card.onclick = (e) => selectColor(color.hex, color.name, color.code, card);

                card.innerHTML = `
                    <div class="color-swatch" style="background-color: ${color.hex};"></div>
                    <div class="color-details">
                        <span class="color-name">${color.name}</span>
                        <span class="color-code">Code: ${color.code}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Handle color selection
        function selectColor(hexCode, name, code, element) {
            activeColor = hexCode;
            activeColorName = `${name} (${code})`;

            document.querySelectorAll('.color-card').forEach(c => c.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('currentColorName').innerText = `Selected: ${activeColorName}`;
        }

        // Apply color to target room surface
        function paintSurface(surfaceId) {
            if (!activeColor) {
                alert("Please pick a color option from the interior color palette first!");
                return;
            }

            const surface = document.getElementById(surfaceId);
            surface.style.backgroundColor = activeColor;
        }

        // Initialize on load
        window.onload = initPalette;
    </script>

</body>
</html>
