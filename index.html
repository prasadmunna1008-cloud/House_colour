<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interior Wall Paint Visualizer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p.instruction {
            color: #555;
            margin-bottom: 20px;
            font-size: 1.1rem;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Color Palette Section */
        .palette-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        .colors {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .color-box {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .color-box:hover {
            transform: scale(1.1);
        }

        .color-box.active {
            border-color: #2c3e50;
            transform: scale(1.15);
        }

        /* 3D Interior Room Simulation */
        .room-container {
            position: relative;
            width: 100%;
            height: 450px;
            background: #e0e0e0;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #ccc;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .room {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        /* Walls */
        .wall {
            position: absolute;
            cursor: pointer;
            transition: background-color 0.3s ease, filter 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: rgba(0,0,0,0.3);
            font-size: 1.2rem;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .wall:hover {
            filter: brightness(0.95);
        }

        /* Back Wall */
        #backWall {
            width: 60%;
            height: 70%;
            top: 15%;
            left: 20%;
            background-color: #d1d8e0;
            z-index: 1;
        }

        /* Left Wall */
        #leftWall {
            width: 20%;
            height: 70%;
            top: 15%;
            left: 0;
            transform: skewY(25deg);
            transform-origin: top right;
            background-color: #a5b1c2;
            z-index: 2;
        }

        /* Right Wall */
        #rightWall {
            width: 20%;
            height: 70%;
            top: 15%;
            right: 0;
            transform: skewY(-25deg);
            transform-origin: top left;
            background-color: #778ca3;
            z-index: 2;
        }

        /* Floor */
        .floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 15%;
            background: #b2bec3;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: bottom;
            border-top: 2px solid #888;
        }

        .selected-info {
            font-size: 1rem;
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Interior Wall Paint Visualizer</h1>
    <p class="instruction">First, select a color from the palette below, then click on the wall you want to paint.</p>

    <div class="container">
        <!-- Color Palette -->
        <div class="palette-section">
            <label><strong>Select Color Palette:</strong> <span id="currentColorName" class="selected-info">No color selected</span></label>
            <div class="colors">
                <div class="color-box" style="background-color: #f5cd79;" onclick="selectColor('#f5cd79', 'Smart Natural (Sand)')" title="Smart Natural"></div>
                <div class="color-box" style="background-color: #cf6a87;" onclick="selectColor('#cf6a87', 'Rose Pink')" title="Rose Pink"></div>
                <div class="color-box" style="background-color: #546de5;" onclick="selectColor('#546de5', 'Royal Blue')" title="Royal Blue"></div>
                <div class="color-box" style="background-color: #778beb;" onclick="selectColor('#778beb', 'Sky Mist')" title="Sky Mist"></div>
                <div class="color-box" style="background-color: #e15f41;" onclick="selectColor('#e15f41', 'Terracotta')" title="Terracotta"></div>
                <div class="color-box" style="background-color: #3dc1d3;" onclick="selectColor('#3dc1d3', 'Aqua Green')" title="Aqua Green"></div>
                <div class="color-box" style="background-color: #f8c291;" onclick="selectColor('#f8c291', 'Soft Peach')" title="Soft Peach"></div>
            </div>
        </div>

        <!-- 3D Interior Room View -->
        <div class="room-container">
            <div class="room">
                <div id="leftWall" class="wall" onclick="paintWall('leftWall')">Left Wall</div>
                <div id="backWall" class="wall" onclick="paintWall('backWall')">Back Wall</div>
                <div id="rightWall" class="wall" onclick="paintWall('rightWall')">Right Wall</div>
                <div class="floor"></div>
            </div>
        </div>
    </div>

    <script>
        let activeColor = null;

        // Function to select a color
        function selectColor(colorCode, colorName) {
            activeColor = colorCode;
            
            // Remove active class from all boxes
            document.querySelectorAll('.color-box').forEach(box => {
                box.classList.remove('active');
            });

            // Add active class to the clicked box
            event.target.classList.add('active');

            // Update info text for the user
            document.getElementById('currentColorName').innerText = `Selected Color: ${colorName}`;
        }

        // Function to apply color to a wall
        function paintWall(wallId) {
            if (!activeColor) {
                alert("Please select a color from the palette above first!");
                return;
            }

            const wall = document.getElementById(wallId);
            wall.style.backgroundColor = activeColor;
        }
    </script>

</body>
</html>
