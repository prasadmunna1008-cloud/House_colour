<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSW Paints Interior Visualizer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            text-align: center;
        }

        p.instruction {
            color: #555;
            margin-bottom: 20px;
            font-size: 1rem;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 950px;
            width: 100%;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Dropdown Control Section */
        .palette-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        .dropdown-wrapper {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        select {
            padding: 10px 15px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            flex-grow: 1;
            background-color: #fafafa;
            cursor: pointer;
        }

        .selected-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .color-swatch-box {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.2);
        }

        /* 3D Room Container */
        .room-container {
            position: relative;
            width: 100%;
            height: 480px;
            background: #cbd5e1;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #b0bec5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .room {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Room Components */
        .wall {
            position: absolute;
            cursor: pointer;
            transition: background-color 0.3s ease, filter 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.4);
            font-size: 1.1rem;
            border: 1px solid rgba(0,0,0,0.15);
        }

        .wall:hover {
            filter: brightness(0.94);
        }

        /* Upper Wall / Ceiling */
        #upperWall {
            top: 0;
            left: 0;
            width: 100%;
            height: 20%;
            background-color: #e2e8f0;
            border-bottom: 2px solid #cbd5e1;
        }

        /* Back Wall */
        #backWall {
            top: 20%;
            left: 20%;
            width: 60%;
            height: 65%;
            background-color: #d1d8e0;
        }

        /* Left Wall */
        #leftWall {
            top: 20%;
            left: 0;
            width: 20%;
            height: 65%;
            background-color: #a5b1c2;
            transform: skewY(20deg);
            transform-origin: top right;
        }

        /* Right Wall */
        #rightWall {
            top: 20%;
            right: 0;
            width: 20%;
            height: 65%;
            background-color: #778ca3;
            transform: skewY(-20deg);
            transform-origin: top left;
        }

        /* Lower Wall / Skirting Area */
        #lowerWall {
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15%;
            background-color: #94a3b8;
            border-top: 2px solid #64748b;
        }

        .selected-status {
            font-size: 0.95rem;
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>JSW Paints Interior Wall & Room Visualizer</h1>
    <p class="instruction">Step 1: Select an exact shade from the JSW shade card dropdown. Step 2: Click on any wall section (Upper, Left, Back, Right, or Lower) to paint it.</p>

        <div class="palette-section">

            <div class="dropdown-wrapper">
                <select id="colorDropdown" onchange="handleColorChange()">
                    <option value="">-- Choose an Interior Shade --</option>
                </select>
                <div class="selected-preview">
                    <div id="activeSwatch" class="color-swatch-box" style="background-color: #ffffff;"></div>
                    <span id="currentColorName" class="selected-status">No color selected</span>
                </div>
            </div>
        </div>

        <!-- 3D Interior Interactive Room View -->
        <div class="room-container">
            <div class="room">
                <div id="upperWall" class="wall" onclick="paintSurface('upperWall')">Upper Wall / Ceiling</div>
                <div id="leftWall" class="wall" onclick="paintSurface('leftWall')">Left Wall</div>
                <div id="backWall" class="wall" onclick="paintSurface('backWall')">Back Wall</div>
                <div id="rightWall" class="wall" onclick="paintSurface('rightWall')">Right Wall</div>
                <div id="lowerWall" class="wall" onclick="paintSurface('lowerWall')">Lower Wall / Skirting</div>
            </div>
        </div>
    </div>
